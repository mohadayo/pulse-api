services:
  metrics-collector:
    build:
      context: ./services/metrics-collector
    ports:
      - "${COLLECTOR_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AGGREGATOR_URL=http://aggregator:8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - aggregator
    networks:
      - pulse-net

  aggregator:
    build:
      context: ./services/aggregator
    ports:
      - "${AGGREGATOR_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pulse-net

  notifier:
    build:
      context: ./services/notifier
    ports:
      - "${NOTIFIER_PORT:-8082}:8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AGGREGATOR_URL=http://aggregator:8081
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - aggregator
    networks:
      - pulse-net

networks:
  pulse-net:
    driver: bridge
